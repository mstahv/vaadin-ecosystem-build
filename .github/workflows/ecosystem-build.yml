name: Ecosystem Build

on:
  schedule:
    # Run every 3 hours against 25.3-SNAPSHOT (at 0, 3, 9, 12, 15, 18, 21 - skipping 6 for stable)
    - cron: '0 0,3,9,12,15,18,21 * * *'
    # Run every 3 hours against 25.2-SNAPSHOT (at 1, 4, 7, 10, 13, 16, 19, 22)
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
    # Run daily at 5:00 UTC against 24.9-SNAPSHOT
    - cron: '0 5 * * *'
    # Run daily at 6:00 UTC against latest stable release
    - cron: '0 6 * * *'
    # Run daily at 7:00 UTC against latest pre-release version
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      vaadin_version:
        description: 'Vaadin version to test against (leave empty for latest)'
        required: false
        default: ''

# Explicitly restrict permissions - this workflow runs untrusted code from external repos
# No access to secrets, only minimal permissions needed
permissions: {}

env:
  SNAPSHOT_25_3: '25.3-SNAPSHOT'
  SNAPSHOT_25_2: '25.2-SNAPSHOT'
  SNAPSHOT_24_9: '24.9-SNAPSHOT'

jobs:
  test:
    runs-on: self-hosted
    permissions:
      # Read repo contents to checkout
      contents: read
      # Write issues only for failure notifications (does not expose secrets)
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve work directory with previous build results

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up JBang
        uses: jbangdev/setup-jbang@main

      - name: Set up SDKMAN
        run: |
          curl -s "https://get.sdkman.io" | bash
          echo "SDKMAN_DIR=$HOME/.sdkman" >> $GITHUB_ENV

      - name: Run Ecosystem Build
        id: test
        continue-on-error: true  # Don't fail the job — issue steps handle failures via failed-projects.txt
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"

          # Determine version based on trigger
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 0,3,9,12,15,18,21 * * *" ]; then
              # 25.3-SNAPSHOT schedule (every 3 hours)
              VERSION="$SNAPSHOT_25_3"
              echo "build_type=snapshot" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.schedule }}" = "0 1,4,7,10,13,16,19,22 * * *" ]; then
              # 25.2-SNAPSHOT schedule (every 3 hours, offset)
              VERSION="$SNAPSHOT_25_2"
              echo "build_type=snapshot" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
              # 24.9-SNAPSHOT schedule (daily at 5:00 UTC)
              VERSION="$SNAPSHOT_24_9"
              echo "build_type=snapshot" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
              # Daily schedule - test latest stable (empty = auto-detect)
              VERSION=""
              echo "build_type=release" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
              # Daily schedule - test latest pre-release from Maven Central
              PRE_RELEASE=true
              echo "build_type=pre-release" >> $GITHUB_OUTPUT
            else
              VERSION=""
              echo "build_type=release" >> $GITHUB_OUTPUT
            fi
          elif [ -n "${{ github.event.inputs.vaadin_version }}" ]; then
            VERSION="${{ github.event.inputs.vaadin_version }}"
            echo "build_type=manual" >> $GITHUB_OUTPUT
          else
            VERSION=""
            echo "build_type=manual" >> $GITHUB_OUTPUT
          fi

          echo "vaadin_version=$VERSION" >> $GITHUB_OUTPUT

          if [ "$PRE_RELEASE" = "true" ]; then
            jbang EcosystemBuild.java -q -t 5 -j 2 --pre-release 2>&1 | tee test-output.txt
            EXIT_CODE=${PIPESTATUS[0]}
          elif [ -n "$VERSION" ]; then
            jbang EcosystemBuild.java -q -t 5 -j 2 -v "$VERSION" 2>&1 | tee test-output.txt
            EXIT_CODE=${PIPESTATUS[0]}
          else
            jbang EcosystemBuild.java -q -t 5 -j 2 2>&1 | tee test-output.txt
            EXIT_CODE=${PIPESTATUS[0]}
          fi

          # Capture exit code immediately (PIPESTATUS gets overwritten by subsequent commands)
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Build exit code: $EXIT_CODE"

          # Extract actual version used (from script output)
          ACTUAL_VERSION=$(grep -oE 'Using (custom |pre-release )?Vaadin version: [0-9a-zA-Z.\-]+' test-output.txt | head -1 | sed 's/.*: //' || echo "$VERSION")
          echo "actual_version=$ACTUAL_VERSION" >> $GITHUB_OUTPUT
          echo "Detected Vaadin version: $ACTUAL_VERSION"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.test.outputs.actual_version || 'unknown' }}
          path: |
            work/${{ steps.test.outputs.actual_version }}/*
          retention-days: 7

      - name: Create issues for failed projects
        if: always()
        uses: actions/github-script@v7
        env:
          ACTUAL_VERSION: ${{ steps.test.outputs.actual_version }}
          BUILD_TYPE: ${{ steps.test.outputs.build_type }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.ACTUAL_VERSION || 'unknown';
            const buildType = process.env.BUILD_TYPE;

            // Helper: compute version series (e.g. "25.0.x") for grouping issues
            // SNAPSHOTs stay as-is since they run on different schedules
            function getVersionSeries(v) {
              const snapMatch = v.match(/^(\d+\.\d+)-SNAPSHOT$/);
              if (snapMatch) return { series: v, majorMinor: snapMatch[1], isSnapshot: true };
              // Match stable (25.0.6) and pre-release (25.1.0-beta1, 25.1.0.alpha3)
              const m = v.match(/^(\d+)\.(\d+)\./);
              if (m) return { series: `${m[1]}.${m[2]}.x`, majorMinor: `${m[1]}.${m[2]}`, isSnapshot: false };
              return { series: v, majorMinor: v, isSnapshot: false };
            }

            // Helper: check if an issue title matches a project and version series
            // Supports both new format ("against Vaadin 25.0.x") and old format ("against Vaadin 25.0.6")
            function issueMatchesProjectAndSeries(title, project, series) {
              const m = title.match(/Build failing: (.+) against Vaadin (.+)$/);
              if (!m) return false;
              if (m[1] !== project) return false;
              const titleVersion = m[2];
              if (titleVersion === series) return true;
              // Old-format title: compute its series and compare
              return getVersionSeries(titleVersion).series === series;
            }

            const { series, majorMinor, isSnapshot } = getVersionSeries(version);

            // Logs of this run are archived to <version>-archives/<build id>/, which gives them a permanent URL
            let buildId = null;
            try {
              buildId = fs.readFileSync(`work/${version}/build-id.txt`, 'utf8').trim();
            } catch (e) {
              console.log('Could not read build-id.txt:', e.message);
            }
            const logsBase = 'https://ecosystembuild.parttio.org/logs';
            const buildDirUrl = buildId ? `${logsBase}/${version}-archives/${buildId}/` : `${logsBase}/${version}/`;
            function buildLinks(project) {
              return [
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Build Log:** [${project}-build.log](${buildDirUrl}${encodeURIComponent(project)}-build.log)`,
                `**All logs of this build:** [${buildId || version}](${buildDirUrl})`,
              ].join('\n');
            }

            // Failure signature (failing tests, compile errors or failed goal) is used to tell a
            // recurring failure from a new one. A hash of it is stored in a hidden marker in issues/comments.
            const crypto = require('crypto');
            const SIGNATURE_MARKER = /<!-- failure-signature: (\S+) -->/g;
            function signatureKey(signature) {
              if (!signature) return null;
              if (signature === 'timeout' || signature === 'unknown') return signature;
              return crypto.createHash('sha256').update(signature).digest('hex').substring(0, 16);
            }
            // Signatures that do not identify the failure; for these, fall back to a time window
            const isGenericKey = key => !key || key === 'timeout' || key === 'unknown';
            const FLAKY_WINDOW_MS = 7 * 24 * 60 * 60 * 1000;

            function failureDetails(project) {
              const metadata = failureMetadata[project];
              const parts = [];
              if (metadata?.failureSummary) {
                parts.push('### Failure', '', '````text', metadata.failureSummary, '````');
              }
              const key = signatureKey(metadata?.failureSignature);
              if (key) parts.push(`<!-- failure-signature: ${key} -->`);
              return parts.join('\n');
            }

            // Latest recorded failure signature of an issue: newest comment with a marker, or the body
            async function lastSignatureKey(issue) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              });
              for (const text of [issue.body, ...comments.map(c => c.body)].reverse()) {
                const matches = [...(text || '').matchAll(SIGNATURE_MARKER)];
                if (matches.length > 0) return matches[matches.length - 1][1];
              }
              return null;
            }

            // Read failed projects from file
            let failedProjects = [];
            try {
              const content = fs.readFileSync(`work/${version}/failed-projects.txt`, 'utf8');
              const lines = content.trim().split('\n');
              // Skip first line (vaadin_version=...)
              failedProjects = lines.slice(1).filter(line => line.trim());
            } catch (e) {
              console.log('Could not read failed-projects.txt:', e.message);
              return;
            }

            if (failedProjects.length === 0) {
              console.log('No failed projects to report');
              return;
            }

            // Read failure metadata (original version info)
            let failureMetadata = {};
            try {
              const metadataContent = fs.readFileSync(`work/${version}/failure-metadata.json`, 'utf8');
              failureMetadata = JSON.parse(metadataContent);
            } catch (e) {
              console.log('Could not read failure-metadata.json:', e.message);
            }

            // Get existing issues (both open and closed) for flaky detection
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'build-failure',
              per_page: 100
            });

            // For SNAPSHOTs, use exact version in title (unchanged behavior)
            // For releases/pre-releases, use series format
            const issueTitle = isSnapshot
              ? (project) => `Build failing: ${project} against Vaadin ${version}`
              : (project) => `Build failing: ${project} against Vaadin ${series}`;

            // Create an issue for each failed project
            for (const project of failedProjects) {
              const title = issueTitle(project);

              const metadata = failureMetadata[project];
              const currentKey = signatureKey(metadata?.failureSignature);

              // Check for any existing issue (open or closed) matching project+series.
              // Prefer an open one, otherwise the newest (issues are listed newest first).
              const matchingIssues = issues.filter(i => issueMatchesProjectAndSeries(i.title, project, series));
              const existingIssue = matchingIssues.find(i => i.state === 'open') || matchingIssues[0];

              if (existingIssue && existingIssue.state === 'open') {
                console.log(`Issue already open for ${project}: #${existingIssue.number}`);
                let commented = false;

                // For non-SNAPSHOT: add "Still failing" comment if exact version changed
                if (!isSnapshot) {
                  const bodyMatch = existingIssue.body?.match(/\*\*(?:Last tested version|First seen in):\*\* (.+)/);
                  const lastKnownVersion = bodyMatch ? bodyMatch[1] : null;
                  if (lastKnownVersion && lastKnownVersion !== version) {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: existingIssue.number,
                      body: `Still failing in Vaadin ${version}.\n\n${buildLinks(project)}\n\n${failureDetails(project)}`
                    });
                    commented = true;
                    // Update body with last tested version
                    let updatedBody = existingIssue.body;
                    if (updatedBody.includes('**Last tested version:**')) {
                      updatedBody = updatedBody.replace(/\*\*Last tested version:\*\* .+/, `**Last tested version:** ${version}`);
                    } else {
                      updatedBody = updatedBody.replace(/((?:\*\*First seen in:\*\* .+))/, `$1\n**Last tested version:** ${version}`);
                    }
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: existingIssue.number,
                      body: updatedBody
                    });
                    console.log(`Added "Still failing in ${version}" comment to #${existingIssue.number}`);
                  }
                }

                // Report when the failure changes while the issue is open (e.g. one problem fixed, another appeared)
                if (!commented && currentKey) {
                  const previousKey = await lastSignatureKey(existingIssue);
                  if (previousKey !== currentKey) {
                    const heading = previousKey
                      ? `The failure of **${project}** against Vaadin ${version} has changed.`
                      : `Current failure of **${project}** against Vaadin ${version}.`;
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: existingIssue.number,
                      body: `${heading}\n\n${buildLinks(project)}\n\n${failureDetails(project)}`
                    });
                    console.log(`Failure signature changed for #${existingIssue.number}: ${previousKey} -> ${currentKey}`);
                  }
                }
                continue;
              }

              // A closed issue is reopened as flaky only if it is the same failure again. A different failure
              // (e.g. a new test failing weeks later) gets its own issue. When the failure can't be identified,
              // it counts as the same one only if the issue was closed recently.
              let previousIssue = null;
              if (existingIssue && existingIssue.state === 'closed') {
                const previousKey = await lastSignatureKey(existingIssue);
                const closedRecently = Date.now() - new Date(existingIssue.closed_at).getTime() < FLAKY_WINDOW_MS;
                const sameFailure = isGenericKey(previousKey) || isGenericKey(currentKey)
                  ? closedRecently && (!previousKey || previousKey === currentKey)
                  : previousKey === currentKey;
                console.log(`${project}: closed issue #${existingIssue.number}, signature ${previousKey} -> ${currentKey}, closed recently: ${closedRecently}, same failure: ${sameFailure}`);
                if (!sameFailure) {
                  previousIssue = existingIssue;
                }
              }

              if (existingIssue && existingIssue.state === 'closed' && !previousIssue) {
                // Reopen the closed issue and mark as flaky
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'open',
                  labels: [...new Set([...existingIssue.labels.map(l => l.name), 'flaky'])]
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `Flaky build detected: **${project}** is failing again against Vaadin ${version} with the same failure as before.\n\n${buildLinks(project)}\n\n${failureDetails(project)}`
                });

                // Update title to new series format if it was old-format
                if (existingIssue.title !== title) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existingIssue.number,
                    title: title
                  });
                }

                console.log(`Reopened flaky issue #${existingIssue.number} for ${project}`);
                continue;
              }

              // Build issue body with metadata
              const projectUrl = metadata?.repoUrl || null;
              const projectLink = projectUrl ? `[${project}](${projectUrl})` : project;
              const versionLine = isSnapshot
                ? `**Vaadin Version:** ${version}`
                : `**First seen in:** ${version}`;
              const bodyParts = [
                `The **${projectLink}** build is failing against Vaadin ${isSnapshot ? version : series}.`,
                '',
                `**Project:** ${projectLink}`,
                versionLine,
                `**Build Type:** ${buildType}`,
                buildLinks(project),
              ];

              if (previousIssue) {
                bodyParts.push('', `Previous issue #${previousIssue.number} was about a different failure.`);
              }

              if (metadata) {
                bodyParts.push('');
                bodyParts.push('### Verification with Original Version');
                if (metadata.originalVersion) {
                  bodyParts.push(`**Project's configured Vaadin version:** ${metadata.originalVersion}`);
                  if (metadata.buildsWithOriginal) {
                    bodyParts.push('**Builds with original version:** ✅ Yes');
                    bodyParts.push('');
                    bodyParts.push('> This suggests the failure is caused by changes in Vaadin ' + version);
                    bodyParts.push('');
                    bodyParts.push('**Likely sources of the breaking change:**');
                    bodyParts.push('- [vaadin/flow](https://github.com/vaadin/flow/) - Flow framework');
                    bodyParts.push('- [vaadin/flow-components](https://github.com/vaadin/flow-components/) - Flow component Java APIs');
                    bodyParts.push('- [vaadin/web-components](https://github.com/vaadin/web-components/) - Web Components');
                  } else {
                    bodyParts.push('**Builds with original version:** ❌ No');
                    bodyParts.push('');
                    bodyParts.push('> The project also fails with its original version - this may be an old or new issue in the project itself');
                  }
                } else {
                  bodyParts.push('Could not detect the project\'s original Vaadin version.');
                }
              }

              const details = failureDetails(project);
              if (details) {
                bodyParts.push('', details);
              }

              bodyParts.push('');
              bodyParts.push('Please check the build logs for details.');

              // Add mentions for users who want to be notified
              if (metadata?.notifyUsers && metadata.notifyUsers.length > 0) {
                bodyParts.push('');
                bodyParts.push('---');
                bodyParts.push('cc: ' + metadata.notifyUsers.map(u => `@${u}`).join(' '));
              }

              const body = bodyParts.join('\n');

              // Create version label: "vaadin-25.2" for releases, "vaadin-25.2-SNAPSHOT" for snapshots
              const versionLabel = isSnapshot ? `vaadin-${version}` : `vaadin-${majorMinor}`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['build-failure', versionLabel]
              });

              console.log(`Created issue for ${project}`);
            }

      - name: Close resolved issues
        if: always()
        uses: actions/github-script@v7
        env:
          ACTUAL_VERSION: ${{ steps.test.outputs.actual_version }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.ACTUAL_VERSION || 'unknown';

            // Helper: compute version series (e.g. "25.0.x") for grouping issues
            function getVersionSeries(v) {
              const snapMatch = v.match(/^(\d+\.\d+)-SNAPSHOT$/);
              if (snapMatch) return { series: v, majorMinor: snapMatch[1], isSnapshot: true };
              const m = v.match(/^(\d+)\.(\d+)\./);
              if (m) return { series: `${m[1]}.${m[2]}.x`, majorMinor: `${m[1]}.${m[2]}`, isSnapshot: false };
              return { series: v, majorMinor: v, isSnapshot: false };
            }

            const { series, isSnapshot } = getVersionSeries(version);

            // Logs of this run are archived to <version>-archives/<build id>/, which gives them a permanent URL
            let buildId = null;
            try {
              buildId = fs.readFileSync(`work/${version}/build-id.txt`, 'utf8').trim();
            } catch (e) {
              console.log('Could not read build-id.txt:', e.message);
            }
            const logsBase = 'https://ecosystembuild.parttio.org/logs';
            const buildDirUrl = buildId ? `${logsBase}/${version}-archives/${buildId}/` : `${logsBase}/${version}/`;
            function buildLinks(project) {
              return [
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Build Log:** [${project}-build.log](${buildDirUrl}${encodeURIComponent(project)}-build.log)`,
                `**All logs of this build:** [${buildId || version}](${buildDirUrl})`,
              ].join('\n');
            }

            // Read failed projects to know which ones are still failing
            let failedProjects = [];
            try {
              const content = fs.readFileSync(`work/${version}/failed-projects.txt`, 'utf8');
              const lines = content.trim().split('\n');
              failedProjects = lines.slice(1).filter(line => line.trim());
            } catch (e) {
              // File might not exist if build passed completely
            }

            // Find open issues for this version
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure',
              per_page: 100
            });

            // Close issues for projects that are now passing
            for (const issue of issues) {
              const match = issue.title.match(/Build failing: (.+) against Vaadin (.+)$/);
              if (!match) continue;

              const project = match[1];
              const issueVersion = match[2];

              // Check if this issue belongs to the current version series
              const issueSeries = getVersionSeries(issueVersion);

              // For SNAPSHOTs: exact match only. For releases: match by series.
              const isMatchingIssue = isSnapshot
                ? issueVersion === version
                : issueSeries.series === series;

              if (!isMatchingIssue) continue;

              // If project is still failing, don't close
              if (failedProjects.includes(project)) {
                console.log(`${project} still failing, keeping issue #${issue.number} open`);
                continue;
              }

              // Check if this is a flaky issue
              const isFlaky = issue.labels.some(l => l.name === 'flaky');

              // Flaky 5-pass rule only applies to SNAPSHOTs
              // (non-SNAPSHOTs close immediately since version changes reset the context)
              if (isFlaky && isSnapshot) {
                // Count consecutive passes from build archives. The current run is normally already
                // archived; if not (no build id), count it separately.
                const archivesDir = `work/${version}-archives`;
                const currentArchived = buildId && fs.existsSync(`${archivesDir}/${buildId}`);
                let consecutivePasses = currentArchived ? 0 : 1;
                try {
                  const archiveDirs = fs.readdirSync(archivesDir)
                    .filter(d => fs.statSync(`${archivesDir}/${d}`).isDirectory())
                    .sort()
                    .reverse(); // newest first

                  for (const dir of archiveDirs) {
                    const failedFile = `${archivesDir}/${dir}/failed-projects.txt`;
                    if (!fs.existsSync(failedFile)) {
                      // No failed-projects.txt means all passed in that run
                      consecutivePasses++;
                      continue;
                    }
                    const archiveContent = fs.readFileSync(failedFile, 'utf8');
                    const archiveFailedProjects = archiveContent.trim().split('\n').slice(1).filter(l => l.trim());
                    if (archiveFailedProjects.includes(project)) {
                      break; // Found a failure, stop counting
                    }
                    consecutivePasses++;
                  }
                } catch (e) {
                  console.log(`Could not read archives for ${version}: ${e.message}`);
                }

                if (consecutivePasses < 5) {
                  console.log(`Flaky issue #${issue.number} for ${project}: ${consecutivePasses}/5 consecutive passes, keeping open`);
                  continue;
                }

                // 5+ consecutive passes — resolve the flaky issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Flaky build resolved: **${project}** has passed 5 consecutive builds against Vaadin ${version}.\n\n${buildLinks(project)}`
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });

                console.log(`Closed flaky issue #${issue.number} after 5 consecutive passes: ${issue.title}`);
              } else {
                // Non-flaky or non-SNAPSHOT: close immediately
                // Detect old-format titles (exact version instead of series)
                const isOldFormat = !isSnapshot && issueVersion !== series;
                let closeMessage;
                if (isSnapshot) {
                  closeMessage = `✅ **${project}** now builds successfully against Vaadin ${version}.`;
                } else if (isOldFormat) {
                  closeMessage = `✅ **${project}** — fixed as of Vaadin ${version} (issue was for ${issueVersion}).`;
                } else {
                  closeMessage = `✅ **${project}** — fixed as of Vaadin ${version}.`;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `${closeMessage}\n\n${buildLinks(project)}`
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });

                console.log(`Closed issue #${issue.number}: ${issue.title}`);
              }
            }

      - name: Fail on script error
        if: steps.test.outputs.exit_code != '0'
        run: |
          echo "EcosystemBuild exited with code ${{ steps.test.outputs.exit_code }} (script error, not a project build failure)"
          exit 1
